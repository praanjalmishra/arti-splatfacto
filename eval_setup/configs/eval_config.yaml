rendering:
  resolution: [640, 480]
  n_frames_static: 100              # dense static viewpoints for 3DGS
  n_frames_articulation: 100       # dynamic articulation sequence length
  joint_motion_range: "full"       # could be "half", "quarter", etc.
  ray_tracing: false               # optional: enable for quality, slower speed
  skip_existing: true              # skip already rendered objects

evaluation_metrics:
  geometry: ["psnr", "ssim", "lpips"]
  joint_estimation: ["angular_error", "axis_error", "translation_error"]
  runtime: ["training_time", "inference_time"]

models:
  - name: "TwinSplat"
    config: "configs/twinsplat.yaml"
  - name: "Video2Articulation"
    config: "configs/video2articulation.yaml"

logging:
  save_intermediate: true
  verbose: true
  seed: 42


change_detection:
  area_threshold: 0.01
  cd_kernel_ratio: 0.1
  depth_weight: 0.5
  num_positive_points: 20
  num_negative_points: 20
