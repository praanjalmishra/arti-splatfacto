[project]
name = "arti_splatfacto"
description = "Template repository for creating and registering new methods in nerfstudio."
version = "0.1.0"

dependencies = ["nerfstudio >= 0.3.0"] 

[tool.setuptools.packages.find]
include = ["arti_splatfacto*"]

# register the entry point of your new method here:
[project.entry-points.'nerfstudio.method_configs']
arti_splatfacto = 'arti_splatfacto.config:arti_splatfacto_config'

[project.entry-points.'nerfstudio.dataparser_configs']
custom-dataparser = 'arti_splatfacto.parser_config:arti_splatfacto_dataparser'